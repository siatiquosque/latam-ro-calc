name: Build VPS release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-release-artifact
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/release-notes.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package:vps
      - uses: actions/upload-artifact@v4
        with:
          name: vps-release
          path: .tmp/vps-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
